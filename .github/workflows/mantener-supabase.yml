name: Mantener Supabase despierto

on:
  schedule:
    # Todos los días a las 12:00 UTC (9 de la mañana en Argentina).
    # Diario y no semanal porque este chequeo NO evita que Supabase pause el
    # proyecto —se probó y no funciona—: sirve para avisar cuando ya se durmió.    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY."
            exit 1
          fi

          echo "URL empieza con: $(echo "$SUPABASE_URL" | cut -c1-8)"
          echo "Largo de la clave: ${#SUPABASE_ANON_KEY} caracteres (tienen que ser 208)"

          # Una consulta real a la base. El endpoint raiz /rest/v1/ devuelve 401
          # aunque las credenciales sean correctas, y ademas no toca Postgres:
          # lo que cuenta como actividad es una consulta como esta.
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || salida=$?

          # Sin esto, un fallo de curl mata el script sin imprimir nada, porque
          # GitHub corre los pasos con "bash -e".
          if [ -n "${salida:-}" ]; then
            echo "curl fallo con codigo $salida (3 = URL mal formada)."
            exit 1
          fi

          echo "Supabase respondio: $codigo"

          if [ "$codigo" != "200" ]; then
            echo "El proyecto no esta respondiendo como deberia."
            echo "Revisa https://supabase.com/dashboard - puede estar pausado."
            exit 1
          fi

          echo "Todo bien. El contador de inactividad volvio a cero."
